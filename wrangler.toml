name = "paperboy"
main = "src/index.js"
compatibility_date = "2026-10-25"

# This Worker only runs on a schedule, so it doesn't need a public URL
workers_dev = false

# Settings live in the Cloudflare dashboard, under Settings > Variables and Secrets.
# keep_vars stops each deploy from removing them.
keep_vars = true

# Compile the MJML template to HTML before each deploy
[build]
command = "npm run build"

# Check the feed at the start of every hour
[triggers]
crons = ["0 * * * *"]

# Keep logs, so a failed run shows its error
[observability.logs]
enabled = true
invocation_logs = true

# Remembers the last post that was emailed
[[kv_namespaces]]
binding = "SENT_POSTS"
id = "21fbd26e67c646fca2fe24f541ee3d8f"

# To keep your settings in this file instead, remove keep_vars near the top and fill these in:
# [vars]
# SITE_NAME = "example.com"
# SITE_URL = "https://example.com/"
# FEED_URL = "https://example.com/index.xml"
# FROM_EMAIL = "Your Name <blog@news.example.com>"
# REPLY_TO = "hello@example.com"
# SEGMENT_ID = "your-resend-segment-id"
# TIME_ZONE = "UTC"
# DATE_LOCALE = "en-GB"
# SEND_DELAY_HOURS = "2"

# Lets src/index.js import the compiled template as text
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
